
name: LoginExample CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Restore and Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LoginExample.Tests/LoginExample.Tests.csproj

      - name: Build application and tests
        run: dotnet build LoginExample.Tests/LoginExample.Tests.csproj --configuration Release --no-restore

      - name: Check SQL Server LocalDB
        shell: pwsh
        run: |
          $localDb = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue

          if ($null -eq $localDb) {
            Write-Output "LocalDB command not found."
          }
          else {
            Write-Output "LocalDB executable: $($localDb.Source)"
            SqlLocalDB.exe info
          }
