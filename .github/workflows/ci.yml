
name: LoginExample CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Restore and Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LoginExample.Tests/LoginExample.Tests.csproj

      - name: Build application and tests
        run: dotnet build LoginExample.Tests/LoginExample.Tests.csproj --configuration Release --no-restore

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          $localDb = Get-Command SqlLocalDB.exe -ErrorAction Stop

          Write-Output "LocalDB executable: $($localDb.Source)"

          SqlLocalDB.exe start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start MSSQLLocalDB."
          }

          SqlLocalDB.exe info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to retrieve LocalDB instance information."
          }

      - name: Initialize integration test database
        shell: pwsh
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          DOTNET_ENVIRONMENT: Testing
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install dotnet-ef."
          }

          dotnet ef database update `
            --project LoginExample/LoginExample.csproj `
            --startup-project LoginExample/LoginExample.csproj `
            --context ApplicationDbContext

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to apply database migrations."
          }
      - name: Run integration tests
        shell: pwsh
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          DOTNET_ENVIRONMENT: Testing
        run: |
          dotnet test LoginExample.Tests/LoginExample.Tests.csproj `
            --configuration Release `
            --no-build `
            --logger "console;verbosity=normal"

          if ($LASTEXITCODE -ne 0) {
            throw "Integration tests failed."
          }

      - name: Publish deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish ./LoginExample/LoginExample.csproj -c Release --no-restore -p:UseAppHost=false -o ./artifacts/linux-publish

      - name: Remove non-production settings
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $dir = "./artifacts/linux-publish"

          Remove-Item "$dir/appsettings.Development.json" -Force -ErrorAction SilentlyContinue
          Remove-Item "$dir/appsettings.Testing.json" -Force -ErrorAction SilentlyContinue

          Write-Host "Non-production configuration files removed."

      - name: Verify deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $dir = "./artifacts/linux-publish"

          if (-not (Test-Path "$dir/LoginExample.dll")) {
            throw "LoginExample.dll is missing."
          }

          if (Test-Path "$dir/appsettings.Production.json") {
            throw "Production configuration must not be included."
          }

          if (Test-Path "$dir/publish") {
            throw "Unexpected nested publish directory."
          }

          if (Test-Path "$dir/appsettings.Development.json") {
            throw "Development configuration must not be included."
          }

          if (Test-Path "$dir/appsettings.Testing.json") {
            throw "Testing configuration must not be included."
          }

          Write-Host "Deployment artifact verified."

      - name: Upload deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: loginexample-linux-${{ github.sha }}
          path: ./artifacts/linux-publish/
          if-no-files-found: error
          retention-days: 7
